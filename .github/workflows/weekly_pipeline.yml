name: Weekly IPO Market Pipeline

# Trigger the workflow every Sunday at midnight UTC, or manually via a button
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib requests

      - name: Run Macro Data Enrichment
        run: python scrape_ipos.py

      - name: Retrain Hybrid ML Engine
        run: python train_model.py

      - name: Commit and Push Updated Dashboards
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.csv *.pkl
          git diff --staged --quiet || (git commit -m "Auto-update: Retrained model with latest market data" && git push)
